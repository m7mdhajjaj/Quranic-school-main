# Netlify Configuration - Root Level
# Points Netlify to the Frontend directory

[build]
  base = "Frontend"
  command = "npm run build:force"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "18"
    VITE_API_URL = "https://quranic-school-main.onrender.com"

# SPA Routing - Redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
